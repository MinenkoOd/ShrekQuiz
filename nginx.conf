worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Blazor WASM MIME types (CRITICAL — without these the app won't load)
    types {
        application/wasm wasm;
        application/octet-stream dll;
        application/octet-stream pdb;
        application/octet-stream dat;
    }

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        charset utf-8;

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/javascript application/javascript application/json application/wasm;

        # Security
        server_tokens off;

        # Blazor framework files — long-term cache (hashed filenames)
        location ~* \.(wasm|dll|pdb|dat)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff";
        }

        # Static assets (images, fonts)
        location ~* \.(ico|svg|woff2?|ttf|eot|png|jpg|jpeg|gif)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            access_log off;
        }

        # CSS/JS
        location ~* \.(css|js)$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # SPA fallback — serve index.html for all routes, prevent caching
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }
}
